name: Deploy Unzipped Content

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Path to the zip file to extract'
        required: true
        default: 'DailyLearn-Android.zip'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Decompress
        uses: TonyBogdanov/zip@1.0
        with:
            args: unzip ./${{github.event.inputs.zip_path}} -d ./.
